name: Debug R crash on Windows

on:
  push:
    branches:
      - claude/pr-2761-green-it6ak1
  workflow_dispatch:

jobs:
  rattler-build-r:
    name: rattler-build R recipes (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: rb
          create-args: >-
            -c conda-forge
            rattler-build
          init-shell: bash
      - name: Build r-test recipe (previously crashed with 0xC0000409)
        shell: bash
        run: |
          micromamba run -n rb rattler-build build \
            --recipe test-data/recipes/r-test/recipe.yaml \
            --output-dir "$RUNNER_TEMP/out-r-test"
      - name: Build interpreter-detection/r recipe
        shell: bash
        run: |
          micromamba run -n rb rattler-build build \
            --recipe test-data/recipes/interpreter-detection/r/recipe.yaml \
            --output-dir "$RUNNER_TEMP/out-interp-r"
